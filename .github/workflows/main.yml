name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build APK File
      run: |
        mkdir www
        rsync -av --exclude='www' --exclude='.git' --exclude='.github' ./ www/
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "XVChat" "com.xvchat.app" --web-dir www
        npx cap add android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: XV-Chat-APK
        path: android/app/build/outputs/apk/debug/*.apk
